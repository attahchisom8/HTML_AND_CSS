<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="nav">
    <div class="abs">
      <ul class="main-tab">
        <li>sort by ...</li>
        <li>By Date</li>
        <li>Name</li>
      </ul>
      <ul class="sub-tab">
        <li>week</li>
        <li>Month</li>
        <li>year</li>
      </ul>
      <ul class="weekly-tab">
        <li>week 1</li>
        <li>week 2</li>
        <li>week 3</li>
      </ul>
    </div>
    <div class="toggle-menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>
  </nav>
  <h1>Expense Tracker</h1>
  <input
    type="text"
    id="expense-name"
    list="categories"
    placeholder="Expense name"
    aria-label="expense-name"
    />
    <datalist id="categories">
      <option value="Transpotation">
      <option value="Food" />
      <option value="Entertainment" />
      <option value="Education" />
      <option value="Funding" />
      <option value="Grocessaries" />
      <option value="Accesory purchases" />
      <option value="Bills" />
      <option value="Housing" />
      <<option value="Others" />
    </datalist>
    <input
      type="number"
      id="amount"
      placeholder="amount"
      aria-label="amount"
    />
    <input
      type="date"
      id="expense-date"
      arial-label="date"
      placeholder="Date: Optional"
    />
    <button id="add-expense">Add Expense</button>
    <br>
    <h2>Expenses</h2>
    <table id="expense-table"></table>
    <h3>Total: $<span id="total">0</span></h3>
  <script src="main.js"></script>
</body>
</html>
