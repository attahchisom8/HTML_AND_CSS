<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1"> 
		<link rel="stylesheet" href="style.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
		<title>Animated login page</title>
	</head>
	<body>
		<div class="container" id="container">
			<div class="form-container sign-in">
				<form>
					<h1>Sign in</h1>
					<div class="social-links">
						<a href="#">
							<i class="fa-brands fa-google-plus"></i>
						</a>
						<a href="#">
							<i class="fa-brands fa-facebook-f"></i>
						</a>
						<a href="#">
							<i class="fa-brands fa-github"></i>
						</a>
						<a href="#">
							<i class="fa-brands fa-linkedin-in"></i>
						</a>
					</div>
					<span>Or use your email and password</span>
					<input type="email" placeholder="Email" aria-label="Email address">
					<input type="password" placeholder="password" aria-label="Password">
					<a href="#">Forgotten Password?
					</a>
					<button>Sign in</button>
				</form>
			</div>
			<div class="form-container sign-up">
				<form>
					<h1>Create Account</h1>
					<div class="social-links">
						<a href="#">
							<i class="fa-brands fa-google-plus"></i>
						</a>
						<a href="#">
							<i class="fa-brands fa-facebook-f"></i>
						</a>
						<a href="#">
							<i class="fa-brands fa-github"></i>
						</a>
						<a href="#">
							<i class="fa-brands fa-linkedin-in"></i>
						</a>
					</div>
					<span>register with your credential details or use your email</span>
					<input type="text" placeholder="Name" aria-label="Your Name">
					<input type="email" placeholder="Email" aria-label="Email address">
					<input type="password" placeholder="password" aria-label="Password">
					<button>Sign up</button>
				</form>
			</div>
			<div class="toggle-container">
				<div class="toggle">
					<div class="toggle-panel left">
						<h1>Welcome Back</h1>
						<p>sign in wuth your detais to view all the featires</p>
						<button class="hidden" id="login" >Sign In</button>
					</div>
					<div class="toggle-panel right">
						<h1>Hello Friend</h1>
						<p>Register today with your personal detais to view all the featires</p>
						<button class="hidden" id="register" >Sign Up</button>
					</div>
				</div>
			</div>
		</div>
		<script src="main.js" defer></script>
	</body>
</html>
